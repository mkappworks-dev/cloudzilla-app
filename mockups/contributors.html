<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />

<title>Contributors · mkappworks/cloudzilla — Cloudzilla</title>
<link rel="stylesheet" href="/assets/tailwind.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<body class="min-h-screen flex flex-col antialiased font-sans">
<a href="#main-content" class="skip-link">Skip to main content</a>

<div id="cz-header" data-repo-tab="code"></div>

<main id="main-content" tabindex="-1" class="max-w-[1400px] mx-auto px-6 pt-6 pb-20 flex-1 w-full">
  <div class="space-y-6">

    <section aria-labelledby="contrib-title">
      <h1 id="contrib-title" class="text-2xl font-semibold tracking-tight">Contributors</h1>
      <p class="mt-1 text-[13px] text-muted-foreground max-w-2xl">Aggregated by author across all branches, sorted by total commits.</p>
    </section>

    <section class="rounded-md border border-border bg-card overflow-hidden" aria-labelledby="contrib-table">
      <h2 id="contrib-table" class="sr-only">All contributors</h2>
      <table class="w-full caption-bottom text-sm">
        <thead class="[&_tr]:border-b [&_tr]:border-border">
          <tr class="border-b border-border">
            <th scope="col" class="h-10 px-4 text-left align-middle text-[11px] font-medium text-muted-foreground font-mono uppercase tracking-wider">Contributor</th>

            <th scope="col" class="h-10 px-4 text-left align-middle text-[11px] font-medium text-muted-foreground font-mono uppercase tracking-wider hidden md:table-cell"><span class="sr-only">Activity</span></th>

        </thead>
        <tbody class="[&_tr:last-child]:border-0">

              <div class="flex items-center gap-2">
                <span class="inline-grid place-items-center rounded-full bg-muted border border-border font-medium text-muted-foreground h-6 w-6 text-[10px]" role="img" aria-label="malith">MK</span>
                <span class="text-[13px] font-medium">malith</span>

            </th>
            <td class="p-4 align-middle text-right font-semibold font-mono">245</td>
            <td class="p-4 align-middle text-right hidden sm:table-cell font-mono text-[12px]">
              <span class="text-success">+18,420</span>
              <span class="text-destructive">−7,118</span>
            </td>
            <td class="p-4 align-middle hidden md:table-cell text-muted-foreground"><svg width="80" height="24" viewBox="0 0 80 24" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="0.0,18.9 8.9,15.4 17.8,10.3 26.7,13.7 35.6,8.6 44.4,3.4 53.3,12.0 62.2,6.9 71.1,0.0 80.0,8.6"></polyline></svg></td>

                <span class="inline-grid place-items-center rounded-full bg-muted border border-border font-medium text-muted-foreground h-6 w-6 text-[10px]" role="img" aria-label="daisy">DK</span>

              </div>

            <td class="p-4 align-middle text-right font-semibold font-mono">87</td>
            <td class="p-4 align-middle text-right hidden sm:table-cell font-mono text-[12px]">
              <span class="text-success">+6,210</span>

            </td>
            <td class="p-4 align-middle hidden md:table-cell text-muted-foreground"><svg width="80" height="24" viewBox="0 0 80 24" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="0.0,19.2 8.9,14.4 17.8,24.0 26.7,9.6 35.6,4.8 44.4,14.4 53.3,0.0 62.2,9.6 71.1,19.2 80.0,14.4"></polyline></svg></td>

                <span class="text-[13px] font-medium">kiyo</span>
              </div>
            </th>
            <td class="p-4 align-middle text-right font-semibold font-mono">23</td>
            <td class="p-4 align-middle text-right hidden sm:table-cell font-mono text-[12px]">
              <span class="text-success">+1,422</span>
              <span class="text-destructive">−611</span>
            </td>
            <td class="p-4 align-middle hidden md:table-cell text-muted-foreground"><svg width="80" height="24" viewBox="0 0 80 24" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="0.0,24.0 8.9,24.0 17.8,16.0 26.7,24.0 35.6,24.0 44.4,8.0 53.3,16.0 62.2,0.0 71.1,24.0 80.0,16.0"></polyline></svg></td>
