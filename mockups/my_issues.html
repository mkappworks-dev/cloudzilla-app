<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issues — Cloudzilla</title>
<link rel="stylesheet" href="/assets/tailwind.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen flex flex-col antialiased font-sans">

<a href="#main-content" class="skip-link">Skip to main content</a>

<div id="cz-header" data-account-tab="issues"></div>
<script src="shell.js"></script>

<main id="main-content" tabindex="-1" class="max-w-[1400px] mx-auto px-6 pt-6 pb-20 flex-1 w-full">
  <div class="space-y-5">
    <section class="mb-6">
      <h1 class="text-2xl font-semibold tracking-tight">Issues</h1>
      <p class="mt-1 text-[13px] text-muted-foreground">Issues that involve you across every repository.</p>
    </section>

    <nav aria-label="Issue filter" class="flex items-center gap-1 border-b border-border text-sm" id="tabs">
      <a href="#assignee" data-scope="assignee" class="px-3 py-2.5 border-b -mb-px inline-flex items-center gap-1.5">Assigned <span class="ml-0.5 text-[11px] text-muted-foreground font-mono" aria-label="7 items">7</span></a>
      <a href="#author" data-scope="author" class="px-3 py-2.5 border-b -mb-px inline-flex items-center gap-1.5">Created by you <span class="ml-0.5 text-[11px] text-muted-foreground font-mono" aria-label="9 items">9</span></a>
      <a href="#mentions" data-scope="mentions" class="px-3 py-2.5 border-b -mb-px inline-flex items-center gap-1.5">Mentioned <span class="ml-0.5 text-[11px] text-muted-foreground font-mono" aria-label="2 items">2</span></a>
      <span class="ml-auto inline-flex items-center">
        <a href="#open" data-state="open" class="px-3 py-2.5 border-b -mb-px inline-flex items-center gap-1.5">Open <span class="ml-0.5 text-[11px] text-muted-foreground font-mono" aria-label="7 items">7</span></a>
        <a href="#closed" data-state="closed" class="px-3 py-2.5 border-b -mb-px inline-flex items-center gap-1.5">Closed <span class="ml-0.5 text-[11px] text-muted-foreground font-mono" aria-label="21 items">21</span></a>
      </span>
    </nav>

    <div id="bar"></div>

    <section class="rounded-md border border-border bg-card overflow-hidden" aria-labelledby="myissue-list">
      <h2 id="myissue-list" class="sr-only">Your issues</h2>
      <ol class="divide-y divide-border" id="rows"></ol>
    </section>
    <div id="empty" hidden class="bg-background border border-border rounded-lg p-8 text-center"><p class="text-muted-foreground"></p></div>
  </div>
</main>

<div id="cz-footer"></div>

<script>
(function () {
  var CHIP_STYLES = {
    '#22c55e': '--label-bg:#22c55e;--label-fg:#1f2328;--label-border:#1ead53;--label-dark-bg:#22c55e2e;--label-dark-border:#22c55e66;--label-dark-fg:#22c55e',
    '#a855f7': '--label-bg:#b166f8;--label-fg:#1f2328;--label-border:#9c5ada;--label-dark-bg:#a855f72e;--label-dark-border:#a855f766;--label-dark-fg:#b977f9',
    '#ef4444': '--label-bg:#f15757;--label-fg:#1f2328;--label-border:#d44d4d;--label-dark-bg:#ef44442e;--label-dark-border:#ef444466;--label-dark-fg:#f26969'
  };
  var ISSUES = [
    { repo: 'mkappworks/cloudzilla', n: 312, t: 'Flaky test on push', state: 'open', f: ['assigned', 'mentioned'], by: 'yumi', when: '2h ago', labels: [['bug', '#ef4444']], pri: 'P0', c: 8, k: 1 },
    { repo: 'mkappworks/ingest-pipeline', n: 298, t: 'Replay window UI', state: 'open', f: ['assigned', 'created'], by: 'mkappworks', when: '3d ago', labels: [['feature', '#22c55e'], ['ui', '#a855f7']], pri: 'P1', c: 3, k: 2 },
    { repo: 'acme-corp/db', n: 88, t: 'Schema migration rollback plan', state: 'open', priv: true, f: ['mentioned', 'assigned'], by: 'daisy', when: '8h ago', labels: [], pri: '', c: 14, k: 3 },
    { repo: 'mkappworks/cloudzilla', n: 305, t: 'Wiki search ignores titles', state: 'open', f: ['created'], by: 'mkappworks', when: '1w ago', labels: [['bug', '#ef4444']], pri: 'P2', c: 0, k: 4 },
    { repo: 'mkappworks/cloudzilla', n: 281, t: 'Add CODEOWNERS support', state: 'closed', f: ['created', 'assigned'], by: 'mkappworks', when: '3w ago', labels: [['feature', '#22c55e']], pri: '', c: 5, k: 5 },
    { repo: 'openforge/runner', n: 41, t: 'Runner leaks tmp dirs', state: 'closed', f: ['mentioned'], by: 'kiyo', when: '1mo ago', labels: [], pri: '', c: 2, k: 6 }
  ];
  var ICON = {
    open: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0 mt-0.5 text-success" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3"></circle></svg>',
    closed: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0 mt-0.5 text-destructive" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg>'
  };
  var BADGE = { open: ['bg-success/15 text-success border-success/30', 'Open'], closed: ['bg-destructive/15 text-destructive border-destructive/30', 'Closed'] };
  var PRI = {
    P0: 'bg-destructive/10 text-destructive border-destructive/30',
    P1: 'bg-blue-500/10 text-blue-500 border-blue-500/30',
    P2: 'border-border bg-accent text-muted-foreground'
  };
  function row(i) {
    var labels = i.labels.length ? '<span class="opacity-50 mx-0.5" aria-hidden="true">·</span>' + i.labels.map(function (l) {
      return '<span class="inline-block max-w-full truncate align-middle rounded-full border px-2 py-px text-[11px] leading-4 font-medium border-(color:--label-border) bg-(color:--label-bg) text-(color:--label-fg) dark:border-(color:--label-dark-border) dark:bg-(color:--label-dark-bg) dark:text-(color:--label-dark-fg)" style="' + CHIP_STYLES[l[1]] + '">' + l[0] + '</span>';
    }).join('') : '';
    var pri = i.pri ? '<span class="inline-flex items-center text-[10px] px-1.5 py-0.5 rounded-full border whitespace-nowrap ' + PRI[i.pri] + '">' + i.pri + '</span>' : '';
    var c = i.c ? '<span class="inline-flex items-center gap-1" title="' + i.c + (i.c === 1 ? ' comment' : ' comments') + '"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path></svg>' + i.c + '</span>' : '';
    return '<li><a href="issue_detail.html" class="group relative block px-4 py-3 transition-[padding] hover:bg-accent hover:pl-[18px] before:content-[\'\'] before:absolute before:left-0 before:top-2 before:bottom-2 before:w-0.5 before:rounded-full before:bg-foreground before:opacity-0 before:transition-opacity hover:before:opacity-100">' +
      '<div class="flex items-start gap-3 mb-1.5">' + ICON[i.state] + '<div class="min-w-0 flex-1 flex items-center gap-2 flex-wrap"><span class="font-mono text-[12px] text-muted-foreground">' + i.repo + '</span><span class="opacity-50" aria-hidden="true">·</span>' + (i.priv ? '<span class="inline-flex items-center text-warning" title="Private" aria-label="Private">🔒</span>' : '') + '<p class="text-[13.5px] font-medium leading-snug group-hover:underline">' + i.t +
      '</p><span class="inline-flex items-center gap-1.5 h-[22px] px-2 rounded-full border text-[11px] font-medium ' + BADGE[i.state][0] + '">' + BADGE[i.state][1] + '</span></div></div>' +
      '<div class="flex items-center justify-between gap-3 pl-[27px]"><div class="flex items-center gap-1.5 text-[12px] text-muted-foreground min-w-0 flex-wrap"><span class="font-mono">#' + i.n + '</span><span class="opacity-50" aria-hidden="true">·</span>' +
      '<span class="inline-flex items-center justify-center h-4 w-4 rounded-full border border-border bg-muted text-[8px] font-medium uppercase text-muted-foreground select-none" aria-hidden="true">' + i.by[0].toUpperCase() + '</span><span>' + i.by + '</span><span class="opacity-50" aria-hidden="true">·</span><time>' + i.when + '</time>' + labels +
      '</div><div class="flex items-center gap-3 text-[12px] text-muted-foreground shrink-0">' + pri + c + '</div></div></a></li>';
  }
  var SORTS = [['newest', 'Newest'], ['oldest', 'Oldest'], ['updated', 'Recently updated'], ['comments', 'Most commented']];
  var SCOPES = { assignee: 'assigned', author: 'created', mentions: 'mentioned' };
  var STATES = ['open', 'closed'];
  var REPOS = ['acme-corp/db', 'mkappworks/cloudzilla', 'mkappworks/ingest-pipeline', 'openforge/runner'];
  var st = { scope: 'assignee', repo: '', sort: 'newest', state: 'open', review: '', text: '' };
  var X = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
  var CARET = '<svg class="text-muted-foreground" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M7 10l5 5 5-5"></path></svg>';

  function chip(label, key) {
    return '<a href="#" data-remove="' + key + '" class="inline-flex items-center gap-1 rounded-full border border-border bg-muted px-2 py-0.5 font-mono text-foreground hover:bg-accent" aria-label="Remove filter ' + label + '">' + label + ' ' + X + '</a>';
  }
  function menu(title, key, opts, cur) {
    var items = opts.map(function (o) {
      return '<li><label class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1.5 text-[13px] text-muted-foreground hover:bg-accent hover:text-foreground has-checked:text-foreground"><input type="radio" name="' + key + '" data-key="' + key + '" value="' + o[0] + '"' + (o[0] === cur ? ' checked' : '') + ' class="h-4 w-4 shrink-0 border-border"><span class="min-w-0 flex-1"><span class="block truncate">' + o[1] + '</span></span></label></li>';
    }).join('');
    return '<details class="relative"><summary class="inline-flex h-8 cursor-pointer list-none items-center gap-1.5 rounded-md border border-border bg-card px-2.5 text-[13px] text-foreground hover:bg-accent [&::-webkit-details-marker]:hidden">' + title + ' ' + CARET + '</summary>' +
      '<form onsubmit="return false" class="absolute right-0 top-full z-50 mt-1.5 w-64 rounded-md border border-border bg-popover text-popover-foreground shadow-md"><fieldset class="m-0 border-0 p-0"><legend class="sr-only">Filter by ' + title + '</legend><ul class="max-h-64 overflow-y-auto p-1">' + items + '</ul></fieldset></form></details>';
  }
  function isCurrent(key) { return st.scope === key ? key : ''; }
  function renderBar(count) {
    var chips = [];
    if (st.scope) chips.push(chip(st.scope + ':@me', 'scope'));
    if (STATES.indexOf(st.state) > 1) chips.push(chip('is:' + st.state, 'state'));
    if (st.repo) chips.push(chip('repo:' + st.repo, 'repo'));
    if (st.review) chips.push(chip('review:' + st.review, 'review'));
    if (st.sort !== 'newest') chips.push(chip('sort:' + st.sort, 'sort'));
    var filtered = chips.length || st.text;
    var menus = menu('Author', 'scope', [['author', '@me']], isCurrent('author')) +
      menu('Assignee', 'scope', [['assignee', '@me']], isCurrent('assignee')) +
      menu('Repository', 'repo', REPOS.map(function (r) { return [r, r]; }), st.repo) +
      
      menu('Sort', 'sort', SORTS, st.sort);
    document.getElementById('bar').innerHTML = '<div class="space-y-2"><div class="flex flex-wrap items-center gap-2">' +
      '<form id="search" role="search" onsubmit="return false" class="relative min-w-56 flex-1"><label for="list-filter-search" class="sr-only">Search or filter issues</label>' +
      '<svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-foreground" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>' +
      '<input id="list-filter-search" type="search" value="' + st.text + '" placeholder="Search or filter, e.g. repo:owner/name author:@me" autocomplete="off" class="h-8 w-full pl-8 pr-3 text-[13px] bg-card border border-border rounded-md placeholder:text-muted-foreground focus:outline-hidden focus:ring-2 focus:ring-ring"/></form>' + menus + '</div>' +
      (filtered ? '<div class="flex flex-wrap items-center gap-1.5 text-[12px]">' + chips.join('') + '<span class="text-muted-foreground">' + count + (count === 1 ? ' result' : ' results') + (count ? ' <span aria-hidden="true">·</span> <a href="#" data-clear class="text-primary hover:underline">Clear filters</a>' : '') + '</span></div>' : '') + '</div>';
  }
  function apply(text) {
    var rest = [];
    text.split(/\s+/).filter(Boolean).forEach(function (tok) {
      var m = tok.match(/^(\w+):(\S+)$/), k = m && m[1].toLowerCase(), v = m && m[2].toLowerCase();
      if (k === 'is' && STATES.indexOf(v) >= 0) st.state = v;
      else if (SCOPES[k] && v === '@me') st.scope = k;
      else if (k === 'repo') st.repo = m[2];
      else if (k === 'sort' && SORTS.some(function (s) { return s[0] === v; })) st.sort = v;
      else if (k === 'review' && false) st.review = v;
      else rest.push(tok);
    });
    st.text = rest.join(' ');
  }
  var ON = 'px-3 py-2.5 border-b -mb-px border-foreground text-foreground font-medium inline-flex items-center gap-1.5';
  var OFF = 'px-3 py-2.5 border-b -mb-px border-transparent text-muted-foreground hover:text-foreground inline-flex items-center gap-1.5';
  function render() {
    var rows = ISSUES.filter(function (r) {
      return (!st.scope || r.f.indexOf(SCOPES[st.scope]) >= 0) && r.state === st.state &&
        (!st.repo || r.repo.toLowerCase() === st.repo.toLowerCase()) && (!st.review || true) &&
        (r.repo + ' ' + r.t).toLowerCase().indexOf(st.text.toLowerCase()) >= 0;
    });
    if (st.sort === 'comments') rows.sort(function (a, b) { return b.c - a.c; });
    if (st.sort === 'oldest') rows.sort(function (a, b) { return b.k - a.k; });
    document.getElementById('rows').innerHTML = rows.map(row).join('');
    document.getElementById('rows').parentNode.hidden = !rows.length;
    var empty = document.getElementById('empty');
    empty.hidden = rows.length > 0;
    empty.innerHTML = st.scope || st.repo || st.review || st.text
      ? '<p class="text-muted-foreground">No ' + st.state + ' issues match these filters.</p><a href="#" data-clear class="mt-2 inline-block text-sm text-primary hover:underline">Clear filters</a>'
      : '<p class="text-muted-foreground">No ' + st.state + ' issues.</p>';
    document.querySelectorAll('#tabs a').forEach(function (a) {
      var on = a.dataset.scope ? a.dataset.scope === st.scope : a.dataset.state === st.state;
      a.className = on ? ON : OFF;
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    renderBar(rows.length);
  }
  document.getElementById('tabs').addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (!a) return; e.preventDefault();
    if (a.dataset.scope) st.scope = a.dataset.scope; else st.state = a.dataset.state;
    render();
  });
  document.getElementById('main-content').addEventListener('click', function (e) {
    var a = e.target.closest('[data-remove], [data-clear]'); if (!a) return; e.preventDefault();
    if (a.hasAttribute('data-clear')) { st.scope = st.repo = st.review = st.text = ''; st.sort = 'newest'; }
    else if (a.dataset.remove === 'state') st.state = 'open';
    else st[a.dataset.remove] = a.dataset.remove === 'sort' ? 'newest' : '';
    render();
  });
  document.getElementById('main-content').addEventListener('change', function (e) {
    var k = e.target.dataset && e.target.dataset.key; if (!k) return;
    st[k] = e.target.value; render();
  });
  document.getElementById('main-content').addEventListener('submit', function (e) {
    var input = document.getElementById('list-filter-search'); st.text = ''; apply(input.value); render();
  });
  document.addEventListener('click', function (e) {
    document.querySelectorAll('#bar details[open]').forEach(function (d) { if (!d.contains(e.target)) d.open = false; });
  });
  render();
})();
</script>

</body>
</html>
