  <div class="space-y-6 max-w-5xl">
    <section aria-labelledby="editfile-title">
      <p class="font-mono text-[11px] text-muted-foreground uppercase tracking-wider mb-2">
        <a href="repo.html" class="hover:underline">cloudzilla</a>

        Committing to

    <form id="editfile-form" class="space-y-5">

          <label for="ef-path" class="block text-[12px] font-medium mb-1.5">File path</label>

          <p class="text-[11px] text-muted-foreground mt-1">Change the path to rename or move the file.</p>
        </div>
        <div>
          <label for="ef-content" class="block text-[12px] font-medium mb-1.5">Contents</label>

package router
 
import (
	"net/http"
 
	"github.com/go-chi/chi/v5"
	"github.com/mkappworks-dev/cloudzilla-app/internal/handler"
)
 
// New returns a chi router with all Cloudzilla routes registered.
func New(h *handler.Handlers) http.Handler {
	r := chi.NewRouter()
 
	r.Get("/", h.Home)
	r.Get("/explore", h.Explore)
 
	r.Route("/{owner}/{repo}", func(r chi.Router) {
		r.Get("/", h.PageRepo)
		r.Get("/tree/*", h.PageTree)
		r.Get("/blob/*", h.PageBlob)
		r.Get("/blame/*", h.PageBlame)
		r.Get("/commits/*", h.PageCommits)
		r.Get("/pulse", h.PagePulse)
	})
 
	return r
}
</textarea>
