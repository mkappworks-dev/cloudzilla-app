name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize]

env:
  CGO_ENABLED: "0"
  GOFLAGS: -mod=readonly

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container: golang:1.23
    timeout-minutes: 15
    steps:
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: |
          test -z "$(gofmt -l .)"
        shell: bash
        working-directory: ./src

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23"]
        os: [linux, darwin]
        include:
          - go: "1.23"
            os: linux
            race: "true"
        exclude:
          - go: "1.22"
            os: darwin
    env:
      GO_VERSION: ${{ matrix.go }}
    steps:
      - run: go test ./...
        env:
          RACE: ${{ matrix.race }}
      - name: Report
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        run: echo failed

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - run: ./deploy.sh
    artifacts:
      - name: dist
        path: dist/
