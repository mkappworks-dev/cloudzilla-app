root = "."
tmp_dir = "tmp"

[build]
  cmd = "make dev-build"
  entrypoint = ["./tmp/cloudzilla"]

  # An allowlist, not a denylist: this repo root holds ~52k files, two thirds of
  # them other branches' worktrees and bare repositories, against ~1.5k under
  # cmd and internal. On darwin fsnotify watches through kqueue, which holds a
  # descriptor per watched directory, so overshooting exhausts descriptors
  # rather than merely wasting CPU. An allowlist also stays correct as the repo
  # grows.
  include_dir = ["cmd", "internal"]

  # Go files only, _templ.go included: templ's watcher owns generation, and its
  # output is what tells air a template changed. dev-build must therefore not
  # regenerate, or each build would trigger the next.
  include_ext = ["go"]
  exclude_regex = ["_test\\.go$"]

  delay = 100
  stop_on_error = true

  # SIGINT is what frees :8080 and :2222 — cmd/server/main.go closes the
  # listeners before draining — but the drain then waits up to 30s for
  # in-flight requests, and a git clone over HTTP is one. The kill 2s later
  # abandons a transfer that no longer matters in dev.
  send_interrupt = true
  kill_delay = "2s"

[misc]
  clean_on_exit = true
