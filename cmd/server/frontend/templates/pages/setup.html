{{define "title"}}Setup — Cloudzilla{{end}}

{{define "content"}}
<div class="max-w-md mx-auto mt-16">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-gray-900">☁ Cloudzilla Setup</h1>
    <p class="text-gray-500 mt-2">Create your superadmin account to get started.</p>
  </div>

  <div class="bg-white border border-gray-200 rounded-lg p-8 shadow-sm">
    {{if .Error}}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded text-sm">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/setup" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" name="username" required autofocus
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <button type="submit"
        class="w-full py-2 px-4 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
        Create Superadmin Account
      </button>
    </form>
  </div>
</div>
{{end}}
