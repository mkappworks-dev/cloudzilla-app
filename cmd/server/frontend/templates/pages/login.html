{{define "title"}}Sign In{{end}}

{{define "content"}}
<div class="max-w-md mx-auto mt-12">
  <div class="bg-white border border-gray-200 rounded-lg shadow-md p-8">
    <h1 class="text-2xl font-bold mb-6">Sign In to Cloudzilla</h1>

    {{if .Error}}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
      {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit"
        class="w-full px-4 py-2 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700 transition-colors">
        Sign In
      </button>
    </form>
  </div>
</div>
{{end}}
