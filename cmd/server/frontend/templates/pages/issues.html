{{define "title"}}Issues · {{.Owner}}/{{.RepoName}}{{end}}

{{define "content"}}
<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">
      <a href="/{{.Owner}}/{{.RepoName}}" class="text-blue-600 hover:underline">{{.Owner}}/{{.RepoName}}</a> Issues
    </h1>
  </div>

  {{if .Issues}}
  <div class="space-y-3">
    {{range .Issues}}
    <a href="/{{.Owner}}/{{.RepoName}}/issues/{{.Number}}" class="block bg-white border border-gray-200 rounded-lg p-4 hover:border-blue-300 hover:shadow-md transition-all">
      <div class="flex justify-between items-start">
        <div>
          <h3 class="text-lg font-semibold">{{.Title}}</h3>
          <p class="text-gray-600 text-sm mt-1">#{{.Number}} opened by {{.AuthorName}}</p>
        </div>
        <span class="px-2 py-1 rounded-full text-xs font-medium
          {{if eq .State "open"}}bg-green-100 text-green-700{{else}}bg-red-100 text-red-700{{end}}">
          {{.State}}
        </span>
      </div>
    </a>
    {{end}}
  </div>
  {{else}}
  <div class="bg-white border border-gray-200 rounded-lg p-8 text-center">
    <p class="text-gray-500">No issues yet.</p>
  </div>
  {{end}}
</div>
{{end}}
