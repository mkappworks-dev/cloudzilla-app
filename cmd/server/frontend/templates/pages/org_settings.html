{{define "title"}}{{.Org.Name}} — Settings{{end}}

{{define "content"}}
<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold"><a href="/{{.Org.Name}}" class="text-blue-600 hover:underline">{{.Org.Name}}</a> / Settings</h1>
  </div>

  <div class="bg-white border border-gray-200 rounded-lg p-6">
    <h2 class="text-lg font-semibold mb-4">Members</h2>

    <form hx-post="/api/orgs/{{.Org.Name}}/members" hx-target="#org-members-list" hx-swap="outerHTML" class="flex gap-2 mb-4">
      <input type="text" name="username" placeholder="Username" required class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      <select name="role" class="border border-gray-300 rounded px-3 py-2 text-sm">
        <option value="member">Member</option>
        <option value="owner">Owner</option>
      </select>
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">Add Member</button>
    </form>

    <div id="org-members-list" class="divide-y divide-gray-100 border border-gray-200 rounded-lg">
      {{range .Members}}
      <div class="px-4 py-3 flex justify-between items-center">
        <div>
          <a href="/{{.Username}}" class="text-blue-600 hover:underline font-medium">{{.Username}}</a>
          <span class="ml-2 text-xs text-gray-500 capitalize">{{.Role}}</span>
        </div>
        <button
          hx-delete="/api/orgs/{{$.Org.Name}}/members/{{.Username}}"
          hx-target="#org-members-list"
          hx-swap="outerHTML"
          hx-confirm="Remove {{.Username}} from this organization?"
          class="text-xs text-red-600 hover:underline">
          Remove
        </button>
      </div>
      {{else}}
      <div class="px-4 py-3 text-gray-500 text-sm">No members yet.</div>
      {{end}}
    </div>
  </div>
</div>
{{end}}
