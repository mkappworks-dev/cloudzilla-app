{{define "fragment-ssh-keys-list"}}
<div id="ssh-keys-list" class="space-y-3">
  {{if .SSHKeys}}
    {{range .SSHKeys}}
    <div class="flex items-center justify-between p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors"
         data-key-id="{{.ID}}">
      <div class="flex-1">
        <h4 class="font-semibold text-gray-900">{{.Title}}</h4>
        <p class="text-gray-600 text-sm mt-1">{{.Fingerprint}}</p>
        <p class="text-gray-500 text-xs mt-2">Added {{.CreatedAt.Format "Jan 2, 2006"}}</p>
      </div>
      <button hx-delete="/api/user/keys/{{.ID}}"
              hx-target="#ssh-keys-list"
              hx-swap="outerHTML"
              class="ml-4 px-3 py-2 text-red-600 border border-red-200 rounded hover:bg-red-50 transition-colors text-sm">
        Delete
      </button>
    </div>
    {{end}}
  {{else}}
  <div class="text-center py-8 border border-gray-200 border-dashed rounded-lg bg-gray-50">
    <p class="text-gray-500">No SSH keys yet. Add one above to get started.</p>
  </div>
  {{end}}
</div>
{{end}}
