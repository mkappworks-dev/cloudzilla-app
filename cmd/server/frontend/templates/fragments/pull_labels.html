{{define "fragment-pull-labels"}}
<div id="pull-labels" class="space-y-2">
  <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Labels</h3>
  <div class="flex flex-wrap gap-1">
    {{range .Labels}}
    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium"
          style="background-color: {{.Color}}; color: #000">
      {{.Name}}
      {{if $.CanWrite}}
      <button
        hx-delete="/api/repos/{{$.Owner}}/{{$.RepoName}}/pulls/{{$.PullNumber}}/labels/{{.ID}}"
        hx-target="#pull-labels"
        hx-swap="outerHTML"
        class="ml-0.5 hover:opacity-70 font-bold leading-none"
        title="Remove label">&times;</button>
      {{end}}
    </span>
    {{else}}
    <span class="text-xs text-gray-400">None yet</span>
    {{end}}
  </div>

  {{if and .CanWrite .AllLabels}}
  <details class="mt-2">
    <summary class="text-xs text-blue-600 cursor-pointer hover:underline">Add label</summary>
    <div class="mt-1 space-y-1 max-h-40 overflow-y-auto">
      {{range .AllLabels}}
      <button
        hx-post="/api/repos/{{$.Owner}}/{{$.RepoName}}/pulls/{{$.PullNumber}}/labels/{{.ID}}"
        hx-target="#pull-labels"
        hx-swap="outerHTML"
        class="w-full text-left flex items-center gap-2 px-2 py-1 hover:bg-gray-50 rounded text-xs">
        <span class="w-3 h-3 rounded-full inline-block shrink-0" style="background-color: {{.Color}}"></span>
        {{.Name}}
      </button>
      {{end}}
    </div>
  </details>
  {{end}}
</div>
{{end}}
