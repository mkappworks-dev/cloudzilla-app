{{define "fragment-org-members"}}
<div id="org-members-list" class="divide-y divide-gray-100 border border-gray-200 rounded-lg">
  {{range .Members}}
  <div class="px-4 py-3 flex justify-between items-center">
    <div>
      <a href="/{{.Username}}" class="text-blue-600 hover:underline font-medium">{{.Username}}</a>
      <span class="ml-2 text-xs text-gray-500 capitalize">{{.Role}}</span>
    </div>
    {{if $.CanManage}}
    <button
      hx-delete="/api/orgs/{{$.OrgName}}/members/{{.Username}}"
      hx-target="#org-members-list"
      hx-swap="outerHTML"
      hx-confirm="Remove {{.Username}} from this organization?"
      class="text-xs text-red-600 hover:underline">
      Remove
    </button>
    {{end}}
  </div>
  {{else}}
  <div class="px-4 py-3 text-gray-500 text-sm">No members yet.</div>
  {{end}}
</div>
{{end}}
