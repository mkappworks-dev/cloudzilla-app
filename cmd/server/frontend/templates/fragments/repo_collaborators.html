{{define "fragment-repo-collaborators"}}
<div id="repo-collaborators" class="space-y-2">
  {{if .CanWrite}}
  <form hx-post="/api/repos/{{.Owner}}/{{.RepoName}}/collaborators"
        hx-target="#repo-collaborators"
        hx-swap="outerHTML"
        class="flex gap-3 mb-4">
    <input type="text" name="username" placeholder="Username" required
      class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    <select name="role"
      class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      <option value="reader">Reader</option>
      <option value="writer">Writer</option>
      <option value="admin">Admin</option>
    </select>
    <button type="submit"
      class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">
      Add
    </button>
  </form>
  {{end}}

  {{range .Collabs}}
  <div class="border border-gray-200 rounded-lg p-4 flex justify-between items-center">
    <div>
      <p class="text-sm font-medium">{{.Username}}</p>
      <p class="text-xs text-gray-500 capitalize">{{.Role}}</p>
    </div>
    {{if $.CanWrite}}
    <button
      hx-delete="/api/repos/{{$.Owner}}/{{$.RepoName}}/collaborators?user_id={{.UserID}}"
      hx-target="#repo-collaborators"
      hx-swap="outerHTML"
      hx-confirm="Remove this collaborator?"
      class="text-xs text-red-600 hover:underline ml-4">
      Remove
    </button>
    {{end}}
  </div>
  {{else}}
  <p class="text-gray-500 text-sm">No collaborators yet.</p>
  {{end}}
</div>
{{end}}
