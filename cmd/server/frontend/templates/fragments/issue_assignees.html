{{define "fragment-issue-assignees"}}
<div id="issue-assignees" class="space-y-2">
  <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Assignees</h3>
  <div class="space-y-1">
    {{range .Assignees}}
    <div class="flex items-center justify-between">
      <span class="text-xs font-medium">{{.Username}}</span>
      {{if $.CanWrite}}
      <button
        hx-delete="/api/repos/{{$.Owner}}/{{$.RepoName}}/issues/{{$.IssueNumber}}/assignees?username={{.Username}}"
        hx-target="#issue-assignees"
        hx-swap="outerHTML"
        class="text-xs text-red-500 hover:underline ml-2"
        title="Remove assignee">&times;</button>
      {{end}}
    </div>
    {{else}}
    <span class="text-xs text-gray-400">No one assigned</span>
    {{end}}
  </div>

  {{if .CanWrite}}
  <form hx-post="/api/repos/{{.Owner}}/{{.RepoName}}/issues/{{.IssueNumber}}/assignees"
        hx-target="#issue-assignees"
        hx-swap="outerHTML"
        class="mt-2 flex gap-1">
    <input type="text" name="username" placeholder="Username" required
      class="flex-1 border border-gray-300 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-blue-400">
    <button type="submit"
      class="px-2 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-700">+</button>
  </form>
  {{end}}
</div>
{{end}}
