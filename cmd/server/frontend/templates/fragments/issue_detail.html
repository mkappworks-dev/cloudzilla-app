{{define "fragment-issue-detail"}}
<div id="issue-detail" class="bg-white border border-gray-200 rounded-lg p-6">
  <div class="flex justify-between items-start mb-4">
    <div>
      <h1 class="text-3xl font-bold">{{.Issue.Title}}</h1>
      <p class="text-gray-600 text-sm mt-2">#{{.Issue.Number}} opened by {{.Issue.AuthorName}} on {{.Issue.CreatedAt.Format "Jan 2, 2006"}}</p>
    </div>
    <span class="px-3 py-1 rounded-full text-sm font-medium
      {{if eq .Issue.State "open"}}bg-green-100 text-green-700{{else}}bg-red-100 text-red-700{{end}}">
      {{.Issue.State}}
    </span>
  </div>

  <div class="prose prose-sm max-w-none bg-gray-50 p-4 rounded border border-gray-200 my-4">
    {{.BodyHTML}}
  </div>

  {{if eq .Issue.State "open"}}
  <button
    hx-patch="/api/repos/{{.Owner}}/{{.Repo}}/issues/{{.Issue.Number}}"
    hx-vals='{"state":"closed"}'
    hx-target="#issue-detail" hx-swap="outerHTML"
    class="px-4 py-2 bg-red-600 text-white rounded font-medium hover:bg-red-700 transition-colors">
    Close Issue
  </button>
  {{else}}
  <button
    hx-patch="/api/repos/{{.Owner}}/{{.Repo}}/issues/{{.Issue.Number}}"
    hx-vals='{"state":"open"}'
    hx-target="#issue-detail" hx-swap="outerHTML"
    class="px-4 py-2 bg-green-600 text-white rounded font-medium hover:bg-green-700 transition-colors">
    Re-open Issue
  </button>
  {{end}}
</div>
{{end}}
