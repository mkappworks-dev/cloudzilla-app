{{define "fragment-fork-button"}}
<div id="fork-button" class="flex items-center gap-1">
  {{if .BasePage.CurrentUser}}
  <button
    hx-post="/api/repos/{{.Owner}}/{{.RepoName}}/fork"
    hx-target="#fork-button"
    hx-swap="outerHTML"
    class="inline-flex items-center gap-1 px-3 py-1.5 border border-gray-300 bg-white text-gray-700 rounded text-sm font-medium hover:bg-gray-50 transition-colors">
    &#x2442; Fork
  </button>
  {{else}}
  <a href="/login"
     class="inline-flex items-center gap-1 px-3 py-1.5 border border-gray-300 bg-white text-gray-700 rounded text-sm font-medium hover:bg-gray-50 transition-colors">
    &#x2442; Fork
  </a>
  {{end}}
  <span class="px-2 py-1.5 border border-gray-300 bg-white text-gray-700 rounded text-sm">
    {{.ForkCount}}
  </span>
</div>
{{end}}
