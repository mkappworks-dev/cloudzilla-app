name: CI

on:
  pull_request:
    branches: [main]
  # A PR's run goes stale when a sibling merges first; these catch what it missed.
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # go.mod's toolchain line decides which standard library is scanned.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Download Tailwind CLI
        run: |
          mkdir -p bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            curl -sLf https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-arm64 -o bin/tailwindcss
          else
            curl -sLf https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 -o bin/tailwindcss
          fi
          chmod +x bin/tailwindcss

      - name: Download Mermaid
        run: |
          mkdir -p cmd/server/frontend/static
          curl -sLf https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.min.js \
            -o cmd/server/frontend/static/mermaid.min.js
          echo "28fca7ae6ebc7ed7bb63bde63136a74bfef14f296a57e403657eeb8b32836073  cmd/server/frontend/static/mermaid.min.js" | sha256sum --check

      - name: Generate templ
        run: templ generate ./internal/view/...

      - name: Build Tailwind CSS
        run: |
          bin/tailwindcss -i tailwind/input.css -o cmd/server/frontend/static/main.css --minify

      - name: Run tests
        run: go test ./...

  integration:
    name: Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cloudzilla
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cloudzilla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudzilla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_DSN: postgres://cloudzilla:test@localhost:5432/cloudzilla_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Download Tailwind CLI
        run: |
          mkdir -p bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            curl -sLf https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-arm64 -o bin/tailwindcss
          else
            curl -sLf https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 -o bin/tailwindcss
          fi
          chmod +x bin/tailwindcss

      - name: Download Mermaid
        run: |
          mkdir -p cmd/server/frontend/static
          curl -sLf https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.min.js \
            -o cmd/server/frontend/static/mermaid.min.js
          echo "28fca7ae6ebc7ed7bb63bde63136a74bfef14f296a57e403657eeb8b32836073  cmd/server/frontend/static/mermaid.min.js" | sha256sum --check

      - name: Generate templ
        run: templ generate ./internal/view/...

      - name: Build Tailwind CSS
        run: |
          bin/tailwindcss -i tailwind/input.css -o cmd/server/frontend/static/main.css --minify

      - name: Migrate test database
        run: go run ./cmd/cz-admin migrate
        env:
          CZ_DATABASE_DSN: ${{ env.TEST_DATABASE_DSN }}

      # backup and seed are too slow for every push and need pg_dump 18; run them
      # locally with `make test-integration` (see docs/testing.md).
      - name: Run tests with database
        run: go test $(go list ./... | grep -v -e /internal/backup -e /internal/seed)

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Download Tailwind CLI
        run: |
          mkdir -p bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then
            curl -sLf https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-arm64 -o bin/tailwindcss
          else
            curl -sLf https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 -o bin/tailwindcss
          fi
          chmod +x bin/tailwindcss

      - name: Download Mermaid
        run: |
          mkdir -p cmd/server/frontend/static
          curl -sLf https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.min.js \
            -o cmd/server/frontend/static/mermaid.min.js
          echo "28fca7ae6ebc7ed7bb63bde63136a74bfef14f296a57e403657eeb8b32836073  cmd/server/frontend/static/mermaid.min.js" | sha256sum --check

      - name: Generate templ
        run: templ generate ./internal/view/...

      - name: Build Tailwind CSS
        run: |
          bin/tailwindcss -i tailwind/input.css -o cmd/server/frontend/static/main.css --minify

      - name: Build server binary
        run: go build -o dist/cloudzilla ./cmd/server/.

      - name: Build CLI binary
        run: go build -o dist/cz-admin ./cmd/cz-admin/.

      - name: Build cz client
        run: go build -o dist/cz ./cmd/cz/.

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: cloudzilla-binaries
          path: dist/
          retention-days: 7
